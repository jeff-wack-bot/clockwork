name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch editor tests
        run: node tests/test.js
      - name: Board tests
        run: node tests/grid.test.js
      - name: Editor tests (selection, clipboard, moves, undo)
        run: node tests/editor.test.js
      - uses: browser-actions/setup-firefox@v1
      - name: Interactivity tests (headless Firefox)
        run: python3 tests/run-ui.py

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Collect the site
        run: mkdir _site && cp -r index.html index_old.html styles.html css js _site/ && mkdir -p _site/tests && cp -r tests/ui _site/tests/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
